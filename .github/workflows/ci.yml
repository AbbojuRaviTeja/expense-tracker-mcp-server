name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: etm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/etm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - name: Apply migrations to a fresh database
        run: pnpm db:deploy
      - name: Check migrations match schema.prisma
        run: |
          diff=$(pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code --script) || {
            echo "Migrations are out of sync with schema.prisma:"; echo "$diff"; exit 1; }
      - run: pnpm test
      - run: pnpm build
